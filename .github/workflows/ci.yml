name: CI (LTS, Intel)

# The lts/macos26 line: macOS 26 on Intel Macs (LTS_POLICY.md). GitHub has no Intel runner with macOS 26, so the job
# runs on the Apple Silicon macos-26 image: SwiftPM cross-builds x86_64 natively, and the tests run under Rosetta.
on:
  push:
    branches: [lts/macos26]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Rosetta and Xcode 26
        run: |
          /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: |
          uname -m
          swift --version
      # Homebrew's ffmpeg tool encodes the test fixtures; the app links its own FFmpeg (next steps).
      - name: Homebrew tools
        run: brew install ffmpeg nasm meson ninja pkgconf
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: .deps/x86_64
          key: deps-x86_64-${{ hashFiles('scripts/build-deps.sh') }}
      - name: FFmpeg (prebuilt, or built from source)
        run: scripts/deps.sh fetch
      - name: Test fixtures
        run: scripts/make-fixtures.sh
      # For the Intel Mac workflow (intel-mac.yml), whose runner has no FFmpeg with x264/x265 to make them.
      - name: Upload the fixtures
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: Tests/Fixtures
          retention-days: 14
      - name: Test
        run: scripts/test.sh --no-parallel   # timing tests share 3 cores badly in parallel
      # The package revisions this run built, to compare with (or to commit as) Package.resolved.
      - name: Package.resolved
        run: cat Package.resolved
      - name: Build the app
        run: scripts/make-app.sh
      - name: Upload the app
        run: ditto -c -k --keepParent build/FrameScrub.app FrameScrub-macOS-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FrameScrub-macOS-x86_64
          path: FrameScrub-macOS-x86_64.zip
