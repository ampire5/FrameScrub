name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      # Homebrew's ffmpeg tool encodes the test fixtures; the app links its own FFmpeg (next steps).
      - name: Homebrew tools
        run: brew install ffmpeg meson ninja pkgconf
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: .deps/arm64
          key: deps-arm64-${{ hashFiles('scripts/build-deps.sh') }}
      - name: FFmpeg (prebuilt, or built from source)
        run: scripts/deps.sh fetch
      - name: Test fixtures
        run: scripts/make-fixtures.sh
      - name: Test
        run: scripts/test.sh --no-parallel   # timing tests share 3 cores badly in parallel
      # The whole output; the job's log and summary carry the failed tests (scripts/test-report.sh).
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: .build/test.log
          retention-days: 14
      # The package revisions this run built, to compare with (or to commit as) Package.resolved.
      - name: Package.resolved
        run: cat Package.resolved
      - name: Build the app
        run: scripts/make-app.sh
      - name: Upload the app
        run: ditto -c -k --keepParent build/FrameScrub.app FrameScrub-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FrameScrub-macOS-arm64
          path: FrameScrub-macOS-arm64.zip
