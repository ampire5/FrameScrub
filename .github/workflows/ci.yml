name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Homebrew dependencies
        run: brew install ffmpeg
      - name: Test fixtures
        run: scripts/make-fixtures.sh
      - name: Test
        run: swift test --no-parallel   # timing tests share 3 cores badly in parallel
      # The package revisions this run built, to compare with Package.resolved.
      - name: Package.resolved
        run: cat Package.resolved
      - name: Build the app
        run: scripts/make-app.sh
      - name: Upload the app
        run: ditto -c -k --keepParent build/FrameScrub.app FrameScrub-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FrameScrub-macOS-arm64
          path: FrameScrub-macOS-arm64.zip
