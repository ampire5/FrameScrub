name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew dependencies
        run: brew install ffmpeg
      - name: Test
        run: |
          scripts/make-fixtures.sh
          swift test
      - name: Build the app
        run: scripts/make-app.sh
      # Not signed with a Developer ID yet, and it still uses Homebrew's FFmpeg: the release notes say so.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="FrameScrub-${GITHUB_REF_NAME}-macOS-arm64.zip"
          ditto -c -k --keepParent build/FrameScrub.app "$zip"
          gh release create "$GITHUB_REF_NAME" "$zip" --generate-notes \
            --notes "Unsigned build for Apple Silicon, macOS 26+. Needs \`brew install ffmpeg\`. After unzipping: \`xattr -dr com.apple.quarantine FrameScrub.app\`, then open it."
      # Points the cask in ampire5/homebrew-tap at this release. Needs a TAP_TOKEN secret that can push to that repo.
      - name: Update the Homebrew cask
        if: env.TAP_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 "FrameScrub-${GITHUB_REF_NAME}-macOS-arm64.zip" | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ampire5/homebrew-tap" tap
          sed -i '' -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 .*/  sha256 \"$sha\"/" tap/Casks/framescrub.rb
          git -C tap -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "framescrub $version"
          git -C tap push
